# deploy/docker-compose.yml — split-host deployment per PRD §4.3/§13.4.
#
# Two planes, two hosts:
#   core   (VM2, low RAM)  — postgres redis minio qdrant api mcp web migrate janitor
#   ingest (nsspq, 31GB)   — worker-splitter worker-parser worker-embedder tei-ingest tei-query
#
# Cross-host wiring: stores publish ports ONLY on the host's tailscale IP
# (RAG_TAILSCALE_IP), so ingest workers on nsspq reach them over tailscale
# and nothing is exposed to the LAN/internet. Images are pulled from GHCR
# (CI-built :edge) — never build on VM2.
name: lybrix

x-core-store-env: &core-store-env
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT}   # tailscale URL so presigned PUTs work cross-host
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  TEI_QUERY_URL: ${TEI_QUERY_PUBLIC_URL}   # tei-query on ingest host (nsspq) over tailscale
  TEI_INGEST_URL: ${TEI_INGEST_URL:-http://tei-ingest:80}   # Jetson ollama URL from .env — pipeline health probe embed backend
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-ingest-env: &ingest-env
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@${RAG_TAILSCALE_IP}:5432/rag
  REDIS_URL: redis://${RAG_TAILSCALE_IP}:6379/0
  S3_ENDPOINT: http://minio:9000   # minio runs on THIS host (ingestnet) — parser pulls full PDFs per shard
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  QDRANT_URL: http://${RAG_TAILSCALE_IP}:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  TEI_INGEST_URL: ${TEI_INGEST_URL:-http://tei-ingest:80}   # set in .env to offload to GPU (ollama bge-m3 on Jetson, 1024-dim)
  EMBED_BACKEND: ${EMBED_BACKEND:-tei}
  EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
  TEI_MODEL: ${TEI_MODEL:-BAAI/bge-m3}
  TEI_QUERY_URL: http://tei-query:80
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-16}
  EMBED_CONCURRENCY: ${EMBED_CONCURRENCY:-8}
  PARSING_OCR_ENGINE: ${PARSING_OCR_ENGINE:-rapidocr}
  PARSING_OCR_LANG: ${PARSING_OCR_LANG:-en}
  PARSING_OCR_TEXT_SCORE: ${PARSING_OCR_TEXT_SCORE:-0.5}
  PARSING_TORCH_THREADS: ${PARSING_TORCH_THREADS:-2}
  PARSING_ACCELERATOR_DEVICE: ${PARSING_ACCELERATOR_DEVICE:-cpu}
  PARSING_DO_TABLE_STRUCTURE: ${PARSING_DO_TABLE_STRUCTURE:-true}
  WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-restart: &restart
  restart: unless-stopped

# ---------------- core (VM2) ----------------

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes: [pgdata:/var/lib/postgresql/data]
    ports:
      - "${BIND_IP}:5432:5432"   # ingest plane on nsspq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 10s
      retries: 5
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    profiles: [core]
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    ports:
      - "${BIND_IP}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks: [internal]

  minio:
    <<: *restart
    image: minio/minio
    # Runs on the INGEST host (next to the parser that downloads the full
    # source PDF per shard). Small-plane users (api presign, backfill, web
    # UI) reach it over tailscale — payloads there are tiny.
    profiles: [ingest]
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    networks: [ingestnet]
    ports:
      - "${BIND_IP}:9000:9000"   # presigned PUTs from any tailnet host
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.19.1
    profiles: [core]
    volumes: [qdrantdata:/qdrant/storage]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${BIND_IP}:6333:6333"
    networks: [internal]

  api:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/api:edge
    profiles: [core]
    environment:
      <<: *core-store-env
      # 900-book corpus ≈ 13k shard jobs; default 2000 cap would 429 mid-run.
      # Redis RAM cost trivial (~300B/job ≈ 4MB total).
      MAX_PARSE_BACKLOG: "20000"
    ports:
      - "${BIND_IP}:8000:8000"   # browser (NEXT_PUBLIC_API_URL) + backfill
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      # image has no curl; use python (matches Dockerfile HEALTHCHECK)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/system/health', timeout=3).read()"]
      interval: 15s
    networks: [internal, traefik-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lybrixapi.rule=Host(`lybrix.loxikum.xyz`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.lybrixapi.entrypoints=web"
      - "traefik.http.routers.lybrixapi.priority=200"
      - "traefik.http.services.lybrixapi.loadbalancer.server.port=8000"

  worker-janitor:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [core]
    command: ["python", "-m", "workers.janitor"]
    environment:
      <<: *core-store-env
      JANITOR_INTERVAL: "30"
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  mcp:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/mcp:edge
    profiles: [core]
    environment:
      <<: *core-store-env
      TEI_QUERY_URL: ${TEI_QUERY_PUBLIC_URL}   # tei-query on nsspq over tailscale
      MCP_API_KEY: ${MCP_API_KEY}
      QDRANT_API_KEY: ${QDRANT_API_KEY}   # qdrant service API key (else qdrant-client 401)
      RETRIEVAL_BM25_ENABLED: ${RETRIEVAL_BM25_ENABLED:-false}
      TEI_RERANK_URL: ${TEI_RERANK_PUBLIC_URL:-}   # tei-rerank on nsspq over tailscale
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-30}
      RERANK_TIMEOUT_S: ${RERANK_TIMEOUT_S:-5}
    depends_on: [postgres, qdrant]
    ports:
      - "${BIND_IP}:8430:8430"
    networks: [internal, traefik-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lybrixmcp.rule=Host(`lybrix.loxikum.xyz`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.lybrixmcp.entrypoints=web"
      - "traefik.http.routers.lybrixmcp.priority=200"
      - "traefik.http.services.lybrixmcp.loadbalancer.server.port=8430"

  web:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/web:edge
    profiles: [core]
    environment:
      API_URL: http://api:8000
      MCP_API_URL: http://mcp:8430/mcp   # MCP playground proxy target (internal network)
      MCP_API_KEY: ${MCP_API_KEY}   # playground proxy holds the key server-side; browser never sees it
      HOSTNAME: 0.0.0.0   # Next standalone: default HOSTNAME=container-id binds one iface only — traefik gets refused
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}   # bcrypt hash — see .env.example
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      API_ADMIN_KEY: ${API_ADMIN_KEY}   # admin-scope ragk_ key the web proxy uses server-side
    depends_on: [api, mcp]
    ports:
      - "${BIND_IP}:3000:3000"
    networks: [internal, traefik-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lybrixweb.rule=Host(`lybrix.loxikum.xyz`)"
      - "traefik.http.routers.lybrixweb.entrypoints=web"
      - "traefik.http.routers.lybrixweb.priority=100"
      - "traefik.http.services.lybrixweb.loadbalancer.server.port=3000"

  migrate:
    image: ghcr.io/saufi-opi/lybrix/api:edge
    profiles: [core]
    command: ["alembic", "-c", "/app/migrations/alembic.ini", "upgrade", "head"]
    environment: {<<: *core-store-env}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [internal]

  # ------------- ingest (nsspq) -------------

  worker-splitter:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.splitter"]
    environment: {<<: *ingest-env}
    # Large Calibre PDFs need host-backed temporary space; the 2g tmpfs
    # exhausted while the host still had 162g free.
    mem_limit: 2g
    networks: [ingestnet]

  worker-parser:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      # Tuned 2026-09-09: 2GB/replica × 3 replicas measured (6.2GiB total),
      # 8 cores / 3 parsers = 2 cores each matches OMP_NUM_THREADS=2.
      # Soft budget above sustained peak (3.0-3.1GB) with headroom; hard
      # limit 6g gives ~2x headroom before OOM-kill.
      PARSER_SOFT_RSS_MB: "4608"
      SHARD_LEASE_SECONDS: "900"
      OMP_NUM_THREADS: "2"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 6g
    cpus: 2.6
    # Use host-backed /tmp; large PDFs exceeded the 2g tmpfs while the host
    # still had ample disk space.
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  worker-parser-2:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      PARSER_SOFT_RSS_MB: "4608"
      SHARD_LEASE_SECONDS: "900"
      OMP_NUM_THREADS: "2"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 6g
    cpus: 2.6
    # Use host-backed /tmp; large PDFs exceeded the 2g tmpfs while the host
    # still had ample disk space.
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  worker-parser-3:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      PARSER_SOFT_RSS_MB: "4608"
      SHARD_LEASE_SECONDS: "900"
      OMP_NUM_THREADS: "2"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 6g
    cpus: 2.6
    # Use host-backed /tmp; large PDFs exceeded the 2g tmpfs while the host
    # still had ample disk space.
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  worker-parser-4:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      PARSER_SOFT_RSS_MB: "4608"
      SHARD_LEASE_SECONDS: "900"
      OMP_NUM_THREADS: "1"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 6g
    cpus: 1.5
    # Use host-backed /tmp for large PDFs.
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  worker-embedder:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.embedder"]
    environment:
      <<: *ingest-env
      # Tuned 2026-09-09: parser produces ~3-6 chunks/12s/shard while 3
      # parsers run; EMBED_CONCURRENCY=4 matches TEI warm throughput
      # (~800% CPU, batch 8 → ~1.1s/req). 8 keeps the queue flat without
      # starving the parser's 6 remaining cores.
    mem_limit: 3g
    # Embedding backend is selected by EMBED_BACKEND/TEI_INGEST_URL.
    # Jetson offload must not start the memory-heavy local TEI service.
    networks: [ingestnet]

  tei-ingest:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9   # CPU fallback only
    profiles: [tei]
    command: >
      --model-id ${TEI_MODEL:-BAAI/bge-m3}
      --max-batch-tokens 8192
      --max-concurrent-requests 128
      --dtype float32
      --pooling cls
    volumes: [hfcache:/data]
    # Tuned 2026-09-09: same fp32 load peak as tei-query (6.2-7.3GB); 6g
    # OOM-crash-looped (854 restarts). 8g = headroom. Kept as warm fallback:
    # when TEI_INGEST_URL in .env points at the Jetson GPU (ollama), this
    # container idles but satisfies compose dependencies.
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m    # first boot downloads ~2.3GB from HF
    networks: [ingestnet]

  tei-query:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [ingest]
    command: >
      --model-id ${TEI_MODEL:-BAAI/bge-m3}
      --max-batch-tokens 8192
      --max-concurrent-requests 64
      --dtype float32
      --pooling cls
    volumes: [hfcache:/data]
    # Tuned 2026-09-09: bge-m3 fp32 load peaks 6.2-7.3GB; 5g OOM-crash-looped
    # (861 restarts). 10g covers warm-up; host has 31G and parsers are bounded.
    mem_limit: 10g
    ports:
      - "${BIND_IP}:8082:80"   # mcp on VM2 reaches query embeddings here
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m
    networks: [ingestnet]

  tei-rerank:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [ingest]
    command: >
      --model-id ${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      --max-concurrent-requests 16
      --max-client-batch-size 32
      --dtype float32
    volumes: [hfcache:/data]
    # Phase 2 reranker: cross-encoder over the 30-candidate pool. CPU budget:
    # 4 cores keeps a 30-candidate request under ~500ms p50; the Xeon also
    # runs parsers (3×2.6 + 1.5 cores), embedder, and tei-query. fp32 weights
    # ≈ 2.2GB weights; 8g limit (tei-query lesson: 5g OOM-looped at 6.2G peak —
    # same margin style for a long-context model whose KV/activation memory
    # grows with batch length).
    mem_limit: 8g
    cpus: 8   # was 4: measured 2026-09-19 — at 4 cores a 30-text rerank request
              # exceeds the backend batch forcing (max_batch_requests=8) and 429s
              # with "Model is overloaded"; 8 cores + --max-client-batch-size 32
              # lets TEI accept and internally split the pool. Host has 8 cores
              # and idle ingest workers; parser CPU contention acceptable.
    ports:
      - "${BIND_IP}:8083:80"   # mcp on VM2 reaches rerank here (Tailscale only)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m    # first boot downloads ~2.2GB model into hfcache
    networks: [ingestnet]

volumes: {pgdata: {}, redisdata: {}, miniodata: {}, qdrantdata: {}, hfcache: {}}
networks:
  internal: {}
  ingestnet: {}
  # VM2's shared edge network (created by the main traefik stack). Ignored on
  # the ingest host — only core-plane services reference it.
  traefik-public:
    external: true
