# deploy/docker-compose.yml — lybrix 2.0, split-host deployment.
#
# Two planes, two hosts:
#   core   (VM2, low RAM)  — paradedb redis lybrix-server(serve) web
#   ingest (nsspq, 31GB)   — lybrix-server(splitter/parser/embedder) docling-serve tei planes
#
# 2.0 deltas from 1.0: Qdrant removed (ParadeDB replaces it); api/mcp/workers
# collapsed into the one lybrix-server image; docling-serve joins the ingest
# plane as the OCR/layout fallback. MinIO stays on the INGEST profile (it
# runs next to the parsers that download full source PDFs per shard; the
# api/web/ui reach it over tailscale via S3_PUBLIC_ENDPOINT). Consequently
# every acceptance step that needs object storage: `make up-core &&
# make up-ingest`, not `make up-core` alone.
#
# Cross-host wiring: stores publish ports ONLY on the host's tailscale IP
# (RAG_TAILSCALE_IP), so ingest workers on nsspq reach them over tailscale
# and nothing is exposed to the LAN/internet.

name: lybrix

x-core-store-env: &core-store-env
  DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD}@paradedb:5432/rag?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT}   # tailscale URL so presigned PUTs work cross-host
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  # TEI_QUERY_URL is a first-boot SEED value only (registry-managed after)
  TEI_QUERY_URL: ${TEI_QUERY_PUBLIC_URL}   # tei-query on ingest host (nsspq) over tailscale
  TEI_INGEST_URL: ${TEI_INGEST_URL:-http://tei-ingest:80}   # embed-backend health probe
  DOCLING_URL: http://docling-serve:5001
  ANYDOC_ENABLED: ${ANYDOC_ENABLED:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-ingest-env: &ingest-env
  DATABASE_URL: postgres://rag:${POSTGRES_PASSWORD}@${RAG_TAILSCALE_IP}:5432/rag?sslmode=disable
  REDIS_URL: redis://${RAG_TAILSCALE_IP}:6379/0
  S3_ENDPOINT: http://minio:9000   # minio runs on THIS host — parser pulls full PDFs per shard
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  # TEI_INGEST_URL / TEI_QUERY_URL are first-boot SEED values only — the
  # embedding model registry (UI-manageable) owns runtime config now.
  TEI_INGEST_URL: ${TEI_INGEST_URL:-http://tei-ingest:80}
  TEI_MODEL: ${TEI_MODEL:-BAAI/bge-m3}
  TEI_QUERY_URL: http://tei-query:80
  DOCLING_URL: http://docling-serve:5001
  ANYDOC_ENABLED: ${ANYDOC_ENABLED:-true}
  SHARD_PAGES: ${SHARD_PAGES:-20}
  OCR_MIN_CHARS_PER_PAGE: ${OCR_MIN_CHARS_PER_PAGE:-20}
  WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-restart: &restart
  restart: unless-stopped

# ---------------- core (VM2) ----------------

services:
  paradedb:
    <<: *restart
    image: paradedb/paradedb:17
    profiles: [core]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes: [paradedbdata:/var/lib/postgresql/data]
    ports:
      - "${BIND_IP}:5432:5432"   # ingest plane on nsspq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 10s
      retries: 5
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    profiles: [core]
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    ports:
      - "${BIND_IP}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks: [internal]

  lybrix-server:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [core]
    command: ["serve"]
    environment:
      <<: *core-store-env
      # 900-book corpus ≈ 13k shard jobs; default 2000 cap would 429 mid-run.
      # Redis RAM cost trivial (~300B/job ≈ 4MB total).
      MAX_PARSE_BACKLOG: "20000"
    ports:
      - "${BIND_IP}:8000:8000"   # browser (NEXT_PUBLIC_API_URL) + REST
      - "${BIND_IP}:8430:8430"   # MCP streamable HTTP
    depends_on:
      paradedb: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "/app/lybrix-eval --version 2>/dev/null; wget -qO- http://127.0.0.1:8000/v1/system/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
    networks: [internal, traefik-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lybrixapi.rule=Host(`lybrix.loxikum.xyz`) && (PathPrefix(`/v1`) || PathPrefix(`/openapi.json`))"
      - "traefik.http.routers.lybrixapi.entrypoints=web"
      - "traefik.http.routers.lybrixapi.priority=200"
      - "traefik.http.services.lybrixapi.loadbalancer.server.port=8000"
      - "traefik.http.routers.lybrixmcp.rule=Host(`lybrix.loxikum.xyz`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.lybrixmcp.entrypoints=web"
      - "traefik.http.routers.lybrixmcp.priority=200"
      - "traefik.http.services.lybrixmcp.loadbalancer.server.port=8430"

  web:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/web:edge
    profiles: [core]
    environment:
      API_URL: http://lybrix-server:8000
      MCP_API_URL: http://lybrix-server:8430/mcp   # MCP playground proxy target (internal network)
      MCP_API_KEY: ${MCP_API_KEY}   # playground proxy holds the key server-side; browser never sees it
      HOSTNAME: 0.0.0.0   # Next standalone: default HOSTNAME=container-id binds one iface only — traefik gets refused
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}   # bcrypt hash — see .env.example
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      API_ADMIN_KEY: ${API_ADMIN_KEY}   # admin-scope ragk_ key the web proxy uses server-side
    depends_on: [lybrix-server]
    ports:
      - "${BIND_IP}:3000:3000"
    networks: [internal, traefik-public]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lybrixweb.rule=Host(`lybrix.loxikum.xyz`)"
      - "traefik.http.routers.lybrixweb.entrypoints=web"
      - "traefik.http.routers.lybrixweb.priority=100"
      - "traefik.http.services.lybrixweb.loadbalancer.server.port=3000"

  # ------------- ingest (nsspq) -------------

  minio:
    <<: *restart
    image: minio/minio
    # Runs on the INGEST host (next to the parser that downloads the full
    # source PDF per shard). Small-plane users (api presign, backfill, web
    # UI) reach it over tailscale — payloads there are tiny.
    profiles: [ingest]
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    networks: [ingestnet]
    ports:
      - "${BIND_IP}:9000:9000"   # presigned PUTs from any tailnet host
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s

  docling-serve:
    <<: *restart
    image: quay.io/docling-project/docling-serve:latest
    profiles: [ingest]
    # OCR + layout fallback for scanned/low-yield shards (blueprint §4.2):
    # anydoc handles born-digital PDFs in-process; docling-serve takes the
    # <50 chars/page tier via whole-shard multipart POSTs.
    ports:
      - "${BIND_IP}:5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      retries: 10
      start_period: 5m
    mem_limit: 8g
    networks: [ingestnet]

  lybrix-splitter:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["splitter"]
    environment: {<<: *ingest-env}
    # Large Calibre PDFs need host-backed temporary space; the 2g tmpfs
    # exhausted while the host still had 162g free.
    mem_limit: 2g
    networks: [ingestnet]

  lybrix-parser:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      SHARD_LEASE_SECONDS: "900"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    # 2.0: anydoc handles born-digital shards in-process (sub-100ms) — the
    # 6g/2.6-cpu parser envelope of 1.0 shrinks accordingly; keep headroom
    # for docling-serve-bound scanned shards.
    mem_limit: 4g
    cpus: 2.6
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  lybrix-parser-2:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      SHARD_LEASE_SECONDS: "900"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 4g
    cpus: 2.6
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  lybrix-parser-3:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      SHARD_LEASE_SECONDS: "900"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 4g
    cpus: 2.6
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  lybrix-parser-4:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      SHARD_LEASE_SECONDS: "900"
      PARSER_PDF_CACHE_DIR: /data/pdf-cache
    mem_limit: 4g
    cpus: 1.5
    volumes:
      - /home/appsadmin/pdf-cache:/data/pdf-cache
    networks: [ingestnet]

  lybrix-embedder:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["embedder"]
    environment:
      <<: *ingest-env
    mem_limit: 3g
    networks: [ingestnet]

  lybrix-janitor:
    <<: *restart
    image: ghcr.io/saufi-opi/lybrix/server:edge
    profiles: [ingest]
    command: ["janitor"]
    environment: {<<: *ingest-env}
    mem_limit: 512m
    networks: [ingestnet]

  tei-ingest:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9   # CPU fallback only
    profiles: [tei]
    command: >
      --model-id ${TEI_MODEL:-BAAI/bge-m3}
      --max-batch-tokens 8192
      --max-concurrent-requests 128
      --dtype float32
      --pooling cls
    volumes: [hfcache:/data]
    # Tuned 2026-09-09: same fp32 load peak as tei-query (6.2-7.3GB); 6g
    # OOM-crash-looped (854 restarts). 8g = headroom. Kept as warm fallback:
    # when TEI_INGEST_URL in .env points at the Jetson GPU (ollama), this
    # container idles but satisfies compose dependencies.
    mem_limit: 8g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m    # first boot downloads ~2.3GB from HF
    networks: [ingestnet]

  tei-query:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [ingest]
    command: >
      --model-id ${TEI_MODEL:-BAAI/bge-m3}
      --max-batch-tokens 8192
      --max-concurrent-requests 64
      --dtype float32
      --pooling cls
    volumes: [hfcache:/data]
    # Tuned 2026-09-09: bge-m3 fp32 load peaks 6.2-7.3GB; 5g OOM-crash-looped
    # (861 restarts). 10g covers warm-up; host has 31G and parsers are bounded.
    mem_limit: 10g
    ports:
      - "${BIND_IP}:8082:80"   # mcp on VM2 reaches query embeddings here
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m
    networks: [ingestnet]

  tei-rerank:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    profiles: [ingest]
    command: >
      --model-id ${TEI_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      --max-concurrent-requests 16
      --max-client-batch-size 32
      --dtype float32
    volumes: [hfcache:/data]
    # Phase 2 reranker: cross-encoder over the 30-candidate pool. Kept as-is
    # from 1.0 (still useful later; RERANK_ENABLED gates it server-side).
    mem_limit: 8g
    cpus: 8   # was 4: measured 2026-09-19 — at 4 cores a 30-text rerank request
              # exceeds the backend batch forcing (max_batch_requests=8) and 429s
              # with "Model is overloaded"; 8 cores + --max-client-batch-size 32
              # lets TEI accept and internally split the pool. Host has 8 cores
              # and idle ingest workers; parser CPU contention acceptable.
    ports:
      - "${BIND_IP}:8083:80"   # mcp on VM2 reaches rerank here (Tailscale only)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m    # first boot downloads ~2.2GB model into hfcache
    networks: [ingestnet]

volumes: {paradedbdata: {}, redisdata: {}, miniodata: {}, hfcache: {}}
networks:
  internal: {}
  ingestnet: {}
  # VM2's shared edge network (created by the main traefik stack). Ignored on
  # the ingest host — only core-plane services reference it.
  traefik-public:
    external: true
