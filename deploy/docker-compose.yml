# deploy/docker-compose.yml — split-host deployment per PRD §4.3/§13.4.
#
# Two planes, two hosts:
#   core   (VM2, low RAM)  — postgres redis minio qdrant api mcp web migrate janitor
#   ingest (nsspq, 31GB)   — worker-splitter worker-parser worker-embedder tei-ingest tei-query
#
# Cross-host wiring: stores publish ports ONLY on the host's tailscale IP
# (RAG_TAILSCALE_IP), so ingest workers on nsspq reach them over tailscale
# and nothing is exposed to the LAN/internet. Images are pulled from GHCR
# (CI-built :edge) — never build on VM2.
name: rag-platform

x-core-store-env: &core-store-env
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT}   # tailscale URL so presigned PUTs work cross-host
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  QDRANT_URL: http://qdrant:6333
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-ingest-env: &ingest-env
  DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD}@${RAG_TAILSCALE_IP}:5432/rag
  REDIS_URL: redis://${RAG_TAILSCALE_IP}:6379/0
  S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  QDRANT_URL: http://${RAG_TAILSCALE_IP}:6333
  TEI_INGEST_URL: http://tei-ingest:80
  TEI_QUERY_URL: http://tei-query:80
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-restart: &restart
  restart: unless-stopped

# ---------------- core (VM2) ----------------

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    profiles: [core]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes: [pgdata:/var/lib/postgresql/data]
    ports:
      - "${RAG_TAILSCALE_IP}:5432:5432"   # ingest plane on nsspq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 10s
      retries: 5
    networks: [internal]

  redis:
    <<: *restart
    image: redis:7-alpine
    profiles: [core]
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    ports:
      - "${RAG_TAILSCALE_IP}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    networks: [internal]

  minio:
    <<: *restart
    image: minio/minio
    profiles: [core]
    command: server /data --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    ports:
      - "${RAG_TAILSCALE_IP}:9000:9000"   # presigned PUTs from anywhere on tailnet
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
    networks: [internal]

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.19.1
    profiles: [core]
    volumes: [qdrantdata:/qdrant/storage]
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "${RAG_TAILSCALE_IP}:6333:6333"
    networks: [internal]

  api:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/api:edge
    profiles: [core]
    environment: {<<: *core-store-env}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/v1/system/health"]
      interval: 15s
    networks: [internal]

  worker-janitor:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/workers:edge
    profiles: [core]
    command: ["python", "-m", "workers.janitor"]
    environment:
      <<: *core-store-env
      JANITOR_INTERVAL: "30"
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  mcp:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/mcp:edge
    profiles: [core]
    environment:
      <<: *core-store-env
      TEI_QUERY_URL: ${TEI_QUERY_PUBLIC_URL}   # tei-query on nsspq over tailscale
      MCP_API_KEY: ${MCP_API_KEY}
    depends_on: [postgres, qdrant]
    ports:
      - "${RAG_TAILSCALE_IP}:8430:8430"
    networks: [internal]

  web:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/web:edge
    profiles: [core]
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on: [api]
    ports:
      - "${RAG_TAILSCALE_IP}:3000:3000"
    networks: [internal]

  migrate:
    image: ghcr.io/saufi-opi/rag-platform/api:edge
    profiles: [core]
    command: ["alembic", "upgrade", "head"]
    environment: {<<: *core-store-env}
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    networks: [internal]

  # ------------- ingest (nsspq) -------------

  worker-splitter:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.splitter"]
    environment: {<<: *ingest-env}
    mem_limit: 1g
    tmpfs: ["/tmp:size=2g"]
    networks: [ingestnet]

  worker-parser:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.parser"]
    environment:
      <<: *ingest-env
      WORKER_PREFETCH: "1"
      WORKER_CONCURRENCY: "1"
      PARSER_RECYCLE_AFTER: "10"
      PARSER_SOFT_RSS_MB: "3072"
      SHARD_LEASE_SECONDS: "900"
      OMP_NUM_THREADS: "2"
    mem_limit: 4g
    cpus: 2.0
    tmpfs: ["/tmp:size=2g"]
    networks: [ingestnet]

  worker-embedder:
    <<: *restart
    image: ghcr.io/saufi-opi/rag-platform/workers:edge
    profiles: [ingest]
    command: ["python", "-m", "workers.embedder"]
    environment:
      <<: *ingest-env
      EMBED_BATCH_SIZE: "32"
      EMBED_CONCURRENCY: "4"
    mem_limit: 3g
    depends_on: [tei-ingest]
    networks: [ingestnet]

  tei-ingest:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:1.9   # CPU variant
    profiles: [ingest]
    command: >
      --model-id ${EMBED_MODEL:-BAAI/bge-m3}
      --max-batch-tokens 32768
      --max-concurrent-requests 128
      --dtype float32
      --pooling cls
    volumes: [hfcache:/data]
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m    # first boot downloads ~2.3GB from HF
    networks: [ingestnet]

  tei-query:
    <<: *restart
    image: ghcr.io/huggingface/text-embeddings-inference:1.9
    profiles: [ingest]
    command: >
      --model-id ${EMBED_MODEL:-BAAI/bge-m3}
      --max-batch-tokens 8192
      --max-concurrent-requests 64
      --dtype float32
      --pooling cls
    volumes: [hfcache:/data]
    mem_limit: 5g
    ports:
      - "${RAG_TAILSCALE_IP}:8082:80"   # mcp on VM2 reaches query embeddings here
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 20s
      retries: 20
      start_period: 10m
    networks: [ingestnet]

volumes: {pgdata: {}, redisdata: {}, miniodata: {}, qdrantdata: {}, hfcache: {}}
networks:
  internal: {}
  ingestnet: {}
