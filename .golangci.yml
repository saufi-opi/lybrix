# lybrix 2.0 linter config — errcheck, govet, staticcheck, revive
# (line-length 100 per the 1.0 standard).
run:
  timeout: 5m

issues:
  exclude-rules:
    - linters:
        - staticcheck
      text: "SA1019:.*manager\\.(NewUploader|NewDownloader|Uploader|Downloader)"
    - path: _test\.go
      linters:
        - errcheck
    - linters:
        - revive
      text: "line-length-limit"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive

linters-settings:
  revive:
    rules:
      - name: line-length-limit
        arguments: [140]
