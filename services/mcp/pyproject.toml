[project]
name = "rag-mcp"
version = "0.1.0"
description = "MCP server: hybrid search with page-number citations over the corpus (PRD §7.2)."
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "rag-embedding",
    "rag-retrieval",
    "fastmcp>=3.2",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.uv.sources]
rag-core = { workspace = true }
rag-embedding = { workspace = true }
rag-retrieval = { workspace = true }
