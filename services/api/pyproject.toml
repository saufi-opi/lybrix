[project]
name = "rag-api"
version = "0.1.0"
description = "Control-plane REST API: uploads/presign, documents, collections, search, SSE, system (PRD §9)."
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "rag-retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
rag-core = { workspace = true }
rag-retrieval = { workspace = true }
