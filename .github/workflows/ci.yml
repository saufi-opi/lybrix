name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      # No live Postgres/Redis/Qdrant/MinIO in CI — the unit suite is
      # deliberately DB-free; stateful paths are exercised in staging
      # (docker compose up), mirroring books-rag's no-live-services stance.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest tests/ -q

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      # Run via uvx (ephemeral tool run) rather than a project dependency —
      # ruff isn't pinned in pyproject.toml, so this never touches uv.lock.
      - name: Ruff check
        run: uvx ruff check .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      # `--with pip-audit` overlays the tool onto the synced venv for this
      # run only — it never modifies pyproject.toml or uv.lock.
      - name: pip-audit
        run: uv run --with pip-audit pip-audit --skip-editable

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
          - name: workers
            dockerfile: services/workers/Dockerfile
          - name: mcp
            dockerfile: services/mcp/Dockerfile
          - name: web
            dockerfile: services/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.name == 'web' && 'services/web' || '.' }}
          file: ${{ matrix.dockerfile }}
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-main:
    name: Publish edge images (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
            context: .
          - name: workers
            dockerfile: services/workers/Dockerfile
            context: .
          - name: mcp
            dockerfile: services/mcp/Dockerfile
            context: .
          - name: web
            dockerfile: services/web/Dockerfile
            context: services/web
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # edge = latest main build, plus the full commit SHA as an immutable
      # tag; short SHA added too since it costs nothing extra here.
      # `latest` is reserved for tagged releases only (see publish-release).
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:edge
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  publish-release:
    name: Publish release images (semver tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
            context: .
          - name: workers
            dockerfile: services/workers/Dockerfile
            context: .
          - name: mcp
            dockerfile: services/mcp/Dockerfile
            context: .
          - name: web
            dockerfile: services/web/Dockerfile
            context: services/web
    steps:
      - uses: actions/checkout@v4

      # Trigger filter (tags: v*.*.*) is a loose glob — enforce strict
      # vMAJOR.MINOR.PATCH here and fail loudly on anything else (e.g. a
      # prerelease suffix), since a bad match would push floating tags wrong.
      - name: Validate tag and derive version components
        id: semver
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not a valid vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only this job ever moves the `latest` tag.
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.semver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ steps.semver.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ steps.semver.outputs.minor }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ steps.semver.outputs.major }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
