[project]
name = "rag-retrieval"
version = "0.1.0"
description = "Qdrant collection mgmt, hybrid search with RRF fusion, hydration, rerank (PRD §5.3, §7.1)."
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "qdrant-client>=1.19",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.uv.sources]
rag-core = { workspace = true }
