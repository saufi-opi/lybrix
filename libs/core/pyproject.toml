[project]
name = "rag-core"
version = "0.1.0"
description = "Shared domain: settings, DB models, queue contracts, storage, observability, error taxonomy (PRD §5, §6.7, §10)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "sqlalchemy>=2.0.40",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.2",
    "boto3>=1.37",
    "structlog>=25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
