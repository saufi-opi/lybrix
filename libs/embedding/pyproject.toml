[project]
name = "rag-embedding"
version = "0.1.0"
description = "TEI client: batching, backoff, circuit breaker; model registry (PRD §6.4, §4.3)."
requires-python = ">=3.12"
dependencies = [
    "rag-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding"]

[tool.uv.sources]
rag-core = { workspace = true }
